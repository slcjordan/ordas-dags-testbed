# The linter configuration this repository judges ORDAS by.
#
# Chosen from convention and then frozen. That is the only thing that makes a
# verdict here worth anything: if this file is tuned to what the generator
# happens to emit, a green build says the generator agrees with itself, which
# `make dag-gate-c` in the generator's own repository already says for free.
#
# So the rule for editing this file is the opposite of the usual one. A
# generated file failing these checks is a defect IN THE GENERATOR, and the fix
# belongs in internal/emit. Relaxing a rule here to make a build pass converts
# the only independent measurement in the project into a formality.
#
# What is selected is a common, unremarkable set. E/F/W are the defaults worth
# having, I sorts imports, UP catches spellings that are wrong for the pinned
# interpreter, B is bugbear, SIM and C4 and RUF are widely enabled. PL is
# deliberately absent -- it is a minority choice and PLR2004 fires on every
# literal in a generated test -- and its absence is a stated gap rather than an
# accommodation: a customer who enables it will see findings this repository
# does not.

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
